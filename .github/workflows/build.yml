name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull request runs are worth cancelling; runs on main are not. Merging three pull
# requests inside a minute killed the first two runs, main was left with a cancelled run as its
# newest result, and the badge went red while every recipe was passing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The recipes are independent projects with no aggregator pom, so the matrix is discovered from
  # the tree instead of being maintained by hand. A new recipe folder is picked up on its own.
  discover:
    runs-on: ubuntu-latest
    outputs:
      recipes: ${{ steps.list.outputs.recipes }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          recipes=$(find spring-ai langchain4j -mindepth 1 -maxdepth 1 -type d \
                      -exec test -f '{}/pom.xml' \; -print | sort | jq -R -s -c 'split("\n")[:-1]')
          echo "recipes=$recipes" >> "$GITHUB_OUTPUT"

  # The wrapper is distributionType=only-script, so each job would fetch the Maven distribution
  # itself. Thirty-six simultaneous requests for the same 9 MB zip get throttled by Maven Central,
  # and a throttled job fails before running a test, which reads as a broken recipe. Fetch it once
  # here and let the matrix restore it from the cache.
  prime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - id: cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('**/.mvn/wrapper/maven-wrapper.properties') }}

      - if: steps.cache.outputs.cache-hit != 'true'
        working-directory: spring-ai/01-chat-basic
        run: |
          chmod +x mvnw
          for attempt in 1 2 3 4 5; do
            ./mvnw -B -v && exit 0
            echo "distribution fetch attempt $attempt failed, retrying"
            sleep 20
          done
          exit 1

      - id: deps
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-deps-${{ hashFiles('**/pom.xml') }}

      # The recipes share almost all of their dependencies, so fetching two of them here
      # pulls down the bulk once. Without this every job resolves the same tree at the same
      # moment and Maven Central answers some of them with 429, which fails the job before a
      # test runs. That is what happened on the Spring AI 2.0 upgrade, when the whole
      # dependency set was new and no cache existed yet.
      - if: steps.deps.outputs.cache-hit != 'true'
        run: |
          for recipe in spring-ai/01-chat-basic langchain4j/01-chat-basic; do
            chmod +x "$recipe/mvnw"
            for attempt in 1 2 3; do
              (cd "$recipe" && ./mvnw -B -q --no-transfer-progress dependency:go-offline) && break
              echo "$recipe: dependency fetch attempt $attempt failed, retrying"
              sleep 30
            done
          done

  recipe:
    needs: [discover, prime]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # Capped so a cache miss cannot put 36 simultaneous resolvers on Maven Central.
      max-parallel: 8
      matrix:
        recipe: ${{ fromJson(needs.discover.outputs.recipes) }}
    name: ${{ matrix.recipe }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      # Defensive: the index should already carry mode 100755 (tools/fix_exec_bits.sh), but a
      # wrapper committed from Windows without it would fail here with "Permission denied".
      - run: chmod +x "${{ matrix.recipe }}/mvnw"

      # Both are populated by the prime job above, so these are hits and nothing is fetched.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('**/.mvn/wrapper/maven-wrapper.properties') }}

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-deps-${{ hashFiles('**/pom.xml') }}

      # A fallback for a cache miss, kept separate from the test run: a download failure must not
      # look like a failing recipe. The tests themselves are never retried - that would hide a
      # flaky test, which is what this suite exists to catch.
      - name: Warm the Maven distribution
        working-directory: ${{ matrix.recipe }}
        run: |
          for attempt in 1 2 3; do
            ./mvnw -B -v && exit 0
            echo "wrapper download attempt $attempt failed, retrying"
            sleep 20
          done
          exit 1

      # No API keys are set anywhere in CI. Every test stubs the model; a test that needs a real
      # provider is gated on COOKBOOK_LIVE and skips itself.
      - run: ./mvnw -B --no-transfer-progress clean test
        working-directory: ${{ matrix.recipe }}

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_links.py

  # Single required status check. The matrix job names change whenever a recipe is added, so
  # branch protection points at this one instead.
  build:
    if: always()
    needs: [recipe, links]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        run: |
          echo "recipe: ${{ needs.recipe.result }}"
          echo "links:  ${{ needs.links.result }}"
          [ "${{ needs.recipe.result }}" = "success" ] || exit 1
          [ "${{ needs.links.result }}" = "success" ] || exit 1
