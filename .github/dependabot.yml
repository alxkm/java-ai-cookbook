# One grouped pull request per ecosystem, not one per dependency per recipe.
#
# The first version of this file listed all 36 projects separately with a per-project PR limit.
# Dependabot ran on the first push and opened well over a hundred pull requests, each triggering
# the full CI matrix. Two things keep that from happening again: `directories` with a glob, so all
# 36 poms are one update config, and a group matching every pattern, so they land in one PR.
#
# Grouping is also the honest shape here - the versions are deliberately identical across every
# pom, so they should move together or not at all.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: maven
    directories:
      - "/spring-ai/*"
      - "/langchain4j/*"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      maven:
        patterns: ["*"]
    # No blanket major-version ignore. The previous one was written while the recipes were on
    # Spring AI 1.x, and it went on to hide the fact that Spring Boot 3.5 had reached the end of
    # its OSS support - exactly the bump it most needed to surface. Majors here are a decision
    # to make, which means they have to be visible enough to decide about.
    commit-message:
      prefix: deps
