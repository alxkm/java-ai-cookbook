# One entry per recipe: the projects are independent, each pins its own versions, and there is no
# aggregator pom for Dependabot to walk. Adding a recipe means adding an entry here by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: ci

  - package-ecosystem: maven
    directory: "/langchain4j/01-chat-basic"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps

  - package-ecosystem: maven
