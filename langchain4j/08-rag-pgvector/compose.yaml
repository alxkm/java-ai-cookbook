# docker compose up -d before running the example.
services:
  pgvector:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: cookbook
      POSTGRES_USER: cookbook
      POSTGRES_PASSWORD: cookbook
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cookbook"]
      interval: 2s
      timeout: 3s
      retries: 30
