spring:
  main:
    web-application-type: none
    banner-mode: off
  ai:
    model:
      chat: ${AI_PROVIDER:openai}
      # The OpenAI starter auto-configures every model type it knows - image, speech,
      # transcription, moderation - not just chat. Without switching the unused ones off,
      # running with AI_PROVIDER=ollama still fails at startup on a missing OpenAI key.
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.2
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-sonnet-5
          temperature: 0.2
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: llama3.2
          # Ollama defaults to a small context and truncates from the front, silently.
          num-ctx: 8192
    mcp:
      client:
        name: java-ai-cookbook
        version: 1.0.0
        request-timeout: 30s
        streamable-http:
          connections:
            # recipe 13 in this repo; any MCP server speaking streamable HTTP works here
            orders:
              url: ${MCP_SERVER_URL:http://localhost:8081}
              endpoint: /mcp

logging:
  level:
    root: WARN
