spring:
  main:
    web-application-type: none
    banner-mode: off
  # A file-backed H2, so the history is still there after a restart - which is the whole point
  # of the persisted half. Swap the url for a real datasource and nothing else changes.
  datasource:
    url: jdbc:h2:file:./data/chat-memory;AUTO_SERVER=TRUE
    username: sa
    password:
  ai:
    # Auto-configuration picks the provider named here. Everything else stays the same.
    model:
      chat: ${AI_PROVIDER:openai}
      # The OpenAI starter auto-configures every model type it knows - image, speech,
      # transcription, moderation - not just chat. Without switching the unused ones off,
      # running with AI_PROVIDER=ollama still fails at startup on a missing OpenAI key.
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    # Creates SPRING_AI_CHAT_MEMORY if it is not there yet. Left unset the repository assumes
    # someone else owns the schema and fails on the first query instead.
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: gpt-4o-mini
        temperature: 0.2
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        model: claude-sonnet-5
        temperature: 0.2
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: llama3.2
        # Ollama defaults to a small context and truncates from the front, silently.
        num-ctx: 8192

logging:
  level:
    root: WARN
