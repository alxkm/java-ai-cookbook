spring:
  main:
    web-application-type: none
    banner-mode: off
  ai:
    # Auto-configuration picks the provider named here. Everything else stays the same.
    model:
      chat: ${AI_PROVIDER:openai}
      # The OpenAI starter auto-configures every model type it knows - image, speech,
      # transcription, moderation - not just chat. Without switching the unused ones off,
      # running with AI_PROVIDER=ollama still fails at startup on a missing OpenAI key.
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    # In Spring AI 2.0 retrying lives in a different place for each kind of client, and every one
    # of them retries by default. CallBudget owns retrying in this recipe, so each layer underneath
    # is switched off here - otherwise every attempt the budget makes is itself several attempts,
    # and the wall-clock bound is a bound on nothing.
    #
    # Ollama still goes through Spring AI's RetryTemplate. max-attempts is handed to
    # RetryPolicy.maxRetries, so despite the name it counts retries: 0 is one attempt, and the
    # default of 10 is eleven attempts and about twenty-two minutes of backoff.
    retry:
      max-attempts: 0
    # OpenAI and Anthropic are built on the providers' own SDKs, which retry by themselves and
    # ignore spring.ai.retry entirely. The OpenAI default is three retries on a 60-second timeout.
    # The timeout is capped at the budget's deadline, because the budget checks the clock between
    # attempts and cannot stop one that is already running.
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: gpt-4o-mini
        temperature: 0.2
        max-retries: 0
        timeout: 8s
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      max-retries: 0
      timeout: 8s
      chat:
        model: claude-sonnet-5
        temperature: 0.2
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: llama3.2
        # Ollama defaults to a small context and truncates from the front, silently.
        num-ctx: 8192

logging:
  level:
    root: WARN
