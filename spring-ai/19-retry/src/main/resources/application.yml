spring:
  main:
    web-application-type: none
    banner-mode: off
  ai:
    # Auto-configuration picks the provider named here. Everything else stays the same.
    model:
      chat: ${AI_PROVIDER:openai}
      # The OpenAI starter auto-configures every model type it knows - image, speech,
      # transcription, moderation - not just chat. Without switching the unused ones off,
      # running with AI_PROVIDER=ollama still fails at startup on a missing OpenAI key.
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    # Spring AI retries underneath the ChatClient. The defaults are 10 attempts, a 2s initial
    # interval, a multiplier of 5 and a 3-minute ceiling - which adds up to just over nineteen
    # minutes of waiting on a single call before it gives up. That is almost never what a
    # request-scoped caller wants, so it is set explicitly here.
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 500ms
        multiplier: 3
        max-interval: 5s
      # 4xx other than 429 means the request itself is wrong; repeating it changes nothing.
      on-client-errors: false
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: gpt-4o-mini
        temperature: 0.2
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        model: claude-sonnet-5
        temperature: 0.2
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: llama3.2
        # Ollama defaults to a small context and truncates from the front, silently.
        num-ctx: 8192

logging:
  level:
    root: WARN
