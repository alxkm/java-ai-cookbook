# Started automatically by spring-boot-docker-compose when you run the app.
services:
  pgvector:
    image: pgvector/pgvector:pg17
    labels:
      # Boot recognises a service by its image name, and it does not know pgvector/pgvector.
      # Without this label the container starts and the datasource is never configured, which
      # surfaces as "Failed to determine a suitable driver class".
      org.springframework.boot.service-connection: postgres
    environment:
      POSTGRES_DB: cookbook
      POSTGRES_USER: cookbook
      POSTGRES_PASSWORD: cookbook
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cookbook"]
      interval: 2s
      timeout: 3s
      retries: 30
